<svg width="860" height="200" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="860" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#131924"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.28" r="0.45">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.18" cy="0.82" r="0.42">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363D" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="858" height="198" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Card -->
    <rect x="1" y="1" width="858" height="198" rx="16" fill="url(#bgGrad)"/>
    <rect x="1" y="1" width="858" height="198" rx="16" fill="url(#grid)"/>
    <rect x="1" y="1" width="858" height="198" rx="16" fill="url(#glow1)"/>
    <rect x="1" y="1" width="858" height="198" rx="16" fill="url(#glow2)"/>

    <!-- Top Accent Bar -->
    <rect x="0" y="0" width="860" height="3" fill="url(#accentGrad)"/>

    <!-- Decorative Bento Mini-Widgets (Right Side) -->
    <g transform="translate(618, 30)">
      <rect x="0" y="0" width="208" height="140" rx="12" fill="#161B22" fill-opacity="0.82" stroke="#30363D" stroke-width="1"/>
      <!-- Terminal Dots -->
      <circle cx="16" cy="16" r="4" fill="#F87171" fill-opacity="0.85"/>
      <circle cx="30" cy="16" r="4" fill="#FBBF24" fill-opacity="0.85"/>
      <circle cx="44" cy="16" r="4" fill="#34D399" fill-opacity="0.85"/>
      <text x="192" y="20" text-anchor="end" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">profile.json</text>
      <line x1="0" y1="30" x2="208" y2="30" stroke="#30363D" stroke-width="1"/>

      <!-- Code Lines -->
      <text x="14" y="52" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">"handle"<tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"@JontCont"</tspan><tspan fill="#8B949E">,</tspan></text>
      <text x="14" y="72" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">"focus"<tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"Full-Stack"</tspan><tspan fill="#8B949E">,</tspan></text>
      <text x="14" y="92" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">"craft"<tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"Clean DX"</tspan><tspan fill="#8B949E">,</tspan></text>
      <text x="14" y="112" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">"openTo"<tspan fill="#8B949E">: </tspan><tspan fill="#7EE787">"Collab"</tspan></text>
    </g>

    <!-- Status Pill -->
    <g transform="translate(36, 32)">
      <rect x="0" y="0" width="194" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="15" cy="13" r="4" fill="#34D399">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="27" y="17" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">Building &amp; Exploring</text>
    </g>

    <!-- Main Name & Tagline -->
    <text x="36" y="106" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.6">
      John Conte
    </text>
    <text x="36" y="136" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">
      Software Developer  ·  Systems &amp; Product Builder  ·  @JontCont
    </text>

    <!-- Subtle Bottom Pills -->
    <g transform="translate(36, 154)">
      <rect x="0" y="0" width="88" height="22" rx="6" fill="#1F2937" stroke="#30363D" stroke-width="1"/>
      <text x="44" y="14.5" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">TypeScript</text>

      <rect x="96" y="0" width="66" height="22" rx="6" fill="#1F2937" stroke="#30363D" stroke-width="1"/>
      <text x="129" y="14.5" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Python</text>

      <rect x="170" y="0" width="84" height="22" rx="6" fill="#1F2937" stroke="#30363D" stroke-width="1"/>
      <text x="212" y="14.5" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Cloud &amp; DX</text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="858" height="198" rx="16" stroke="#30363D" stroke-width="1.2"/>
</svg>
